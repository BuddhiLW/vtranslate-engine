# Patch-bump and publish to the PRIVATE vtranslate Gitea Maven registry.
#
# The engine's source is public on GitHub, but its ARTIFACT is published
# privately: vtranslate-app's worker image resolves it as a pinned
# io.github.buddhilw/vtranslate-engine coordinate instead of git-cloning this
# repo at image-build time. That is what lets Dockerfile.worker build from the
# app repo alone rather than from the vtranslate/ parent.
#
# PINNED mode, as across the hive fleet: the tracked ./VERSION file drives
# deliberate minor/major bumps; CI only ever adds a patch on top of it.
name: release

on:
  push:
    branches: [main]
    # A published pom is immutable, so only a change that alters the LIBRARY
    # mints a version. The suite gates the deploy, so test changes must be able
    # to trigger a run, and so must this workflow itself.
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'version.edn'
      - 'test/**'
      - 'test-int/**'
      - 'dev/**'
      - 'tests.edn'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The official installer touches no API, so it behaves identically on
      # GitHub and Gitea. `clojure --version` is the assertion.
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      - name: Test
        run: clojure -M:test

      # The native suite is the only thing that exercises the real JavaCV
      # extractor. Its stereo regression test is what stands between a
      # resampling bug and a worker that silently transcribes nothing.
      - name: Native integration suite
        run: clojure -M:dev:test:itest:ffmpeg

      # hive-build's :gitea-source target names the repository "hive-gitea".
      # Its credentials come from the environment (and settings.xml below),
      # and once they do, hive-build 0.1.14 takes the URL from MAVEN_URL, not
      # from deps.edn: with MAVEN_URL unset the URL is nil and deps-deploy
      # falls back to Clojars, which answers 401 "No deploy token provided".
      # Every release since the registry move failed exactly that way. The
      # Deploy step therefore sets MAVEN_URL as a plain value, the same URL
      # deps.edn declares, never as a secret: a secret that could retarget a
      # publish is worse than a URL anyone can read in the manifest.
      - name: Materialize private-registry credentials
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_USERNAME:-}" ] || [ -z "${MAVEN_TOKEN:-}" ]; then
            echo "::error::MAVEN_USERNAME + MAVEN_TOKEN are unset on this" \
                 "repository, so the deploy cannot authenticate and would fail" \
                 "at the upload with a 401. Set both as repository secrets; the" \
                 "token must be a gitea PAT with write:package on the" \
                 "vtranslate org."
            exit 1
          fi
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>hive-gitea</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      # Deploy BEFORE the tag. Tagging first means a failed deploy still leaves
      # a pushed tag, so the next run hits "tag already exists" and can never
      # publish that version again. Publishing first makes a tag mean "this
      # version is in the registry".
      - name: Deploy
        env:
          MAVEN_URL: https://gitea.hive-mcp.com/api/packages/vtranslate/maven
        run: clojure -T:build deploy

      - name: Commit and tag
        id: tag
        run: |
          set -euo pipefail
          VER=$(tr -d '\n' < VERSION)
          git config user.name "vtranslate-ci"
          git config user.email "ci@vtranslate.local"
          git add VERSION
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $VER [skip ci]"
          # Annotated: `git push --follow-tags` ignores lightweight tags,
          # which would publish the artifact and silently drop the tag.
          git tag -a "v$VER" -m "release $VER"
          git push --follow-tags
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          generate_release_notes: true
